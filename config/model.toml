active_source_ids = ["S1", "S2", "S3", "S4", "S5"]
sink_capacity_tpy = 4000000.0
enforce_sink_capacity = true

[scenarios.user_inventory_4mt]
description = "All five sources using the original user inventory, constrained to 4 Mt/y at Dunkerque."
flow_basis = "user_case"
active_source_ids = ["S1", "S2", "S3", "S4", "S5"]
sink_capacity_tpy = 4000000.0
enforce_sink_capacity = true

[scenarios.user_inventory_unconstrained]
description = "Diagnostic upper-bound using the original user emissions without a binding receiving-site constraint."
flow_basis = "user_case"
active_source_ids = ["S1", "S2", "S3", "S4", "S5"]
sink_capacity_tpy = 12000000.0
